
name: Deploy Applications to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Provision Infrastructure and Deploy Applications
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v6

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # 3. Set up Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Initialize Terraform
      - name: Terraform Init
        run: terraform -chdir=terraform init

      # 5. Validate Terraform configuration
      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      # 6. Create and review Terraform plan
      - name: Terraform Plan
        run: terraform -chdir=terraform plan -out=tfplan

      # 7. Apply the Terraform plan
      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve tfplan

      # 8. Retrieve EC2 public IP and export it to later steps
      - name: Get EC2 public IP from Terraform
        shell: bash
        run: |
          set -euo pipefail

          EC2_HOST="$(terraform -chdir=terraform output -raw instance_public_ip)"

          if [[ -z "$EC2_HOST" ]]; then
            echo "ERROR: Terraform returned an empty EC2 public IP."
            exit 1
          fi

          echo "EC2_HOST=$EC2_HOST" >> "$GITHUB_ENV"
          echo "EC2 public IP retrieved successfully."

      # 9. Install Ansible on the GitHub Actions runner
      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      # 10. Configure SSH using the retrieved EC2 IP
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${EC2_HOST:-}" ]]; then
            echo "ERROR: EC2_HOST is missing."
            exit 1
          fi

          if [[ -z "$EC2_SSH_KEY" ]]; then
            echo "ERROR: EC2_SSH_KEY secret is missing."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"

          touch "$HOME/.ssh/known_hosts"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      # 11. Wait for EC2 SSH to become available
      - name: Wait for EC2 SSH
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$EC2_USER" ]]; then
            echo "ERROR: EC2_USER secret is missing."
            exit 1
          fi

          for attempt in {1..30}; do
            if ssh \
              -i "$HOME/.ssh/ec2_key" \
              -o BatchMode=yes \
              -o ConnectTimeout=5 \
              -o StrictHostKeyChecking=yes \
              "$EC2_USER@$EC2_HOST" \
              "echo SSH connection successful"; then
              exit 0
            fi

            echo "Waiting for EC2 SSH (attempt $attempt/30)..."
            sleep 10
          done

          echo "ERROR: Could not connect to EC2 over SSH."
          exit 1

      # 12. Configure EC2 and deploy applications using Ansible
      - name: Configure EC2 and deploy applications
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
        shell: bash
        run: |
          set -euo pipefail

          ansible-playbook \
            -i "${EC2_HOST}," \
            -u "$EC2_USER" \
            --private-key "$HOME/.ssh/ec2_key" \
            ansible/deploy.yml

      # 13. Display the deployment URLs
      - name: Display application URLs
        run: |
          echo "EC2 public IP: $EC2_HOST"
          echo "Portfolio URL: http://$EC2_HOST"
          echo "Java application URL: http://$EC2_HOST:8080"
