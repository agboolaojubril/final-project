name: Deploy Applications to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Copy the project to EC2
      - name: Copy project to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "~/final-project"

      # 3. Install Docker and Docker Compose on EC2
      - name: Install Docker and Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is not installed. Installing from Docker's official repository..."
              sudo sh ~/final-project/get-docker.sh
            fi

            sudo systemctl enable --now docker

            if ! docker compose version >/dev/null 2>&1; then
              echo "Docker Compose is unavailable. Install Docker Compose on the EC2 host or restore outbound access to download.docker.com."
              exit 1
            fi

      # 4. Build and deploy both containers on EC2
      - name: Build and deploy applications
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/final-project
            docker compose up -d --build