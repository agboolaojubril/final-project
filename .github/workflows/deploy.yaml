name: Deploy Applications to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Configure EC2 and Deploy with Ansible
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v6

      # 2. Install Ansible on the GitHub Actions runner
      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      # 3. Configure SSH access
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      - name: Terraform Plan
        run: terraform -chdir=terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve tfplan

      - name: Get EC2 public IP from Terraform
        shell: bash
        run: |
          set -euo pipefail
          EC2_HOST="$(terraform -chdir=terraform output -raw instance_public_ip)"
          if [[ -z "$EC2_HOST" ]]; then
            echo "Terraform returned an empty EC2 public IP."
            exit 1
          fi
          echo "EC2_HOST=$EC2_HOST" >> "$GITHUB_ENV"
          echo "Terraform EC2 public IP retrieved successfully."


      # 4. Configure EC2 and deploy applications using Ansible
      
      
      - name: Configure EC2 and deploy applications
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          ansible-playbook \
            -i "${EC2_HOST}," \
            -u "$EC2_USER" \
            --private-key "$HOME/.ssh/ec2_key" \
            ansible/deploy.yml
            